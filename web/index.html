<style>
  /* โทนจากไม้สต๊าฟวัดระดับ (แดง/ขาว) และหมึกเข้มของแผนที่สำรวจ */
  :root {
    --paper: #fcfdfd; --ink: #1b2629; --muted: #56666b; --rule: #d3dbdc; --wash: #eef2f2;
    --staff: #c41e24; --flood: #2166ac; --gfm: #e84c78;
    --shadow: 0 2px 10px rgba(27, 38, 41, .14);
    --head: "Chakra Petch", "Anuphan", system-ui, sans-serif;
    --body: "Anuphan", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #121a1c; --ink: #e6edee; --muted: #9aabaf; --rule: #2a3639; --wash: #1a2427;
      --staff: #f0544f; --shadow: 0 2px 14px rgba(0, 0, 0, .5);
    }
  }
  :root[data-theme="dark"] {
    --paper: #121a1c; --ink: #e6edee; --muted: #9aabaf; --rule: #2a3639; --wash: #1a2427;
    --staff: #f0544f; --shadow: 0 2px 14px rgba(0, 0, 0, .5);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font: 15px/1.55 var(--body); }
  #map { position: absolute; inset: 0; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--staff); outline-offset: 2px; }

  .panel { position: absolute; background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow); }

  /* ---- แผงด้านซ้าย ---- */
  #side { top: 12px; left: 12px; width: 344px; max-height: calc(100% - 24px); overflow: auto; padding: 14px 18px 16px; }
  .topline { display: flex; justify-content: flex-end; align-items: baseline; font-size: 13.5px; margin-bottom: 10px; }
  .topline .place { color: var(--muted); }
  .link { background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); text-decoration: underline;
    text-decoration-color: var(--rule); text-underline-offset: 3px; }
  .link:hover { text-decoration-color: var(--staff); }
  .topline .links { display: flex; gap: 14px; }
  h1 { font: 600 24px/1.2 var(--head); margin: 0 0 8px; letter-spacing: -.005em; }
  .lede { margin: 0 0 14px; font-size: 14.5px; }
  .lede b { font-family: var(--head); font-weight: 600; color: var(--staff); }

  #search { display: flex; border: 1.5px solid var(--ink); border-radius: 6px; overflow: hidden; }
  #search input { flex: 1; min-width: 0; border: 0; padding: 9px 11px; background: var(--paper); font-size: 15px; }
  #search input:focus { outline: none; }
  #search:focus-within { box-shadow: 0 0 0 3px color-mix(in srgb, var(--staff) 25%, transparent); }
  #search button { border: 0; background: var(--ink); color: var(--paper); padding: 0 14px; cursor: pointer; font-weight: 500; }
  #results { list-style: none; margin: 4px 0 0; padding: 0; border: 1px solid var(--rule); border-radius: 6px; max-height: 210px; overflow: auto; }
  #results li button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 11px; cursor: pointer; font-size: 14px; }
  #results li button:hover, #results li button:focus-visible { background: var(--wash); }
  #results li small { color: var(--muted); }
  #results .msg { padding: 7px 11px; font-size: 14px; color: var(--muted); }

  .seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); margin: 18px 0 10px; border: 1px solid var(--rule); border-radius: 6px; padding: 3px; gap: 3px; }
  .seg button { border: 0; background: none; padding: 6px 8px; border-radius: 4px; cursor: pointer; font-size: 14px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); font-weight: 500; }

  /* สัญลักษณ์แบบไม้บรรทัด/ไม้สต๊าฟ */
  .scale-t { font-size: 13.5px; margin: 0 0 6px; }
  .ruler { position: relative; display: grid; height: 16px; border-radius: 2px; overflow: hidden; }
  .ruler span { display: block; }
  .ticks { position: relative; height: 22px; font: 500 12.5px/1 var(--head); color: var(--muted); font-variant-numeric: tabular-nums; }
  .ticks span { position: absolute; top: 0; padding-top: 5px; transform: translateX(-50%); border-left: 1px solid var(--muted); }
  .ticks span::before { content: ""; position: absolute; left: -1px; top: 0; height: 4px; border-left: 1px solid var(--muted); }
  .ticks span { border-left: 0; }
  .ticks span.end { transform: translateX(-100%); }
  .ticks span.end::before { left: auto; right: 0; }
  .ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .nod { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .nod i { width: 16px; height: 10px; background: #c8c8c8; border-radius: 2px; }

  #slrCtl { margin: 12px 0 6px; }
  #slrCtl .seg { margin: 0 0 8px; }
  #slrCtl .seg button:disabled { opacity: .35; cursor: default; }
  .ctl-l { font-size: 12.5px; color: var(--muted); margin: 2px 0 3px; }
  #slrCtl .seg button { font-size: 13px; padding: 5px 4px; }
  .yr { display: flex; align-items: center; gap: 10px; }
  .yr input { flex: 1; accent-color: var(--ink); }
  .yr output { font: 600 18px/1 var(--head); font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; }
  .swl { display: grid; grid-template-columns: 16px 1fr; gap: 6px 8px; align-items: center; font-size: 13.5px; margin-top: 8px; }
  .swl i { width: 16px; height: 12px; border-radius: 2px; }
  .slr-sum { font-size: 13.5px; margin: 8px 0 0; color: var(--muted); }
  .slr-sum b { color: var(--ink); font-family: var(--head); }
  label.chk { display: flex; align-items: center; gap: 10px; margin: 7px 0; cursor: pointer; font-size: 14px; }
  label.chk input { width: 16px; height: 16px; accent-color: var(--ink); margin: 0; }
  .sw { width: 16px; height: 10px; border-radius: 2px; flex: none; }
  .flood-row { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--rule); }
  details { margin-top: 6px; }
  summary { cursor: pointer; font-size: 14px; padding: 4px 0; color: var(--muted); }
  summary:hover { color: var(--ink); }

  /* ---- การ์ดเมื่อคลิก ---- */
  /* แถบสีอาคาร มุมขวาล่าง */
  #bldLeg { right: 66px; bottom: 12px; width: min(440px, calc(100% - 434px)); padding: 6px 10px 5px; z-index: 1; }
  #bldLeg:empty, body:has(#card.open) #bldLeg { display: none; }
  #bldLeg h2 { font: 600 12px/1.3 var(--head); margin: 0 0 4px; }
  #bldLeg .bl-bar { display: grid; grid-template-columns: repeat(5, 1fr) 0.9fr; column-gap: 2px; }
  #bldLeg i { display: block; height: 7px; border-radius: 1px; }
  #bldLeg .bl-nd { margin-left: 6px; }
  #bldLeg .bl-lab { font-size: 11px; line-height: 1.25; margin-top: 3px; color: var(--muted); }
  #bldLeg .bl-lab b { font-weight: 600; color: var(--ink); }
  #card { right: 66px; bottom: 12px; width: 372px; max-height: calc(100% - 24px); overflow: auto; padding: 16px 18px; display: none; z-index: 5; }
  #card.open { display: block; }
  #card .close { position: absolute; top: 8px; right: 8px; border: 0; background: none; font-size: 22px; cursor: pointer; color: var(--muted); line-height: 1; padding: 6px; }
  #cPlace { font-size: 14px; color: var(--muted); padding-right: 28px; margin-bottom: 4px; }
  .readout { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: start; }
  .num { font: 700 44px/1 var(--head); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .num small { font: 500 15px/1 var(--body); color: var(--muted); margin-left: 6px; letter-spacing: 0; }
  .cls { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 14px; margin: 8px 0 6px; }
  .cls i { width: 12px; height: 12px; border-radius: 2px; }
  #cExpl { font-size: 14.5px; margin: 0; }
  .warn { font-size: 13.5px; margin: 8px 0 0; padding: 6px 9px; background: var(--wash); border-left: 3px solid var(--muted); }
  .gauge { width: 58px; }
  .gauge svg { display: block; overflow: visible; }
  .gauge .drop { transition: height .7s cubic-bezier(.2, .7, .2, 1); }
  @media (prefers-reduced-motion: reduce) { .gauge .drop { transition: none; } }
  .gauge figcaption { font: 600 13px/1.2 var(--head); text-align: center; margin-top: 4px; color: var(--staff); font-variant-numeric: tabular-nums; }

  .block { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule); }
  .block h3 { font: 600 14.5px/1.3 var(--head); margin: 0 0 6px; }
  .why { font-size: 14px; margin: 0 0 8px; }
  .bars { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: center; font-size: 13px; color: var(--muted); }
  .bars .bar { height: 6px; background: var(--wash); border-radius: 3px; overflow: hidden; }
  .bars .bar span { display: block; height: 100%; background: var(--ink); }
  dl.facts { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; margin: 0; font-size: 13.5px; }
  dl.facts dt { color: var(--muted); }
  dl.facts dd { margin: 0; font-variant-numeric: tabular-nums; font-weight: 500; text-align: right; }
  #card canvas { width: 100% !important; height: 180px !important; }

  /* ---- กล่องเกี่ยวกับข้อมูล ---- */
  #about { position: fixed; inset: 0; background: rgba(18, 26, 28, .5); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  #about.open { display: flex; }
  #about .box { max-width: 660px; max-height: 88vh; overflow: auto; background: var(--paper); color: var(--ink); border-radius: 8px; padding: 22px 26px; box-shadow: var(--shadow); }
  #about h3 { margin: 0 0 8px; font: 600 21px/1.25 var(--head); }
  #about h4 { margin: 18px 0 4px; font: 600 15.5px/1.3 var(--head); }
  #about p, #about li { font-size: 14.5px; max-width: 68ch; }
  #about ul { padding-left: 20px; margin: 4px 0; }
  #about a { color: var(--ink); text-decoration-color: var(--staff); text-underline-offset: 3px; }
  #about small { color: var(--muted); }
  #about .close-row { text-align: right; margin: 16px 0 0; }
  #about .btn { border: 1.5px solid var(--ink); background: none; border-radius: 6px; padding: 6px 16px; cursor: pointer; }

  #toggle { display: none; position: absolute; top: 12px; left: 12px; z-index: 3; padding: 8px 14px; border: 1px solid var(--rule); cursor: pointer; font-weight: 500; }
  .maplibregl-ctrl-group { border-radius: 6px; }

  @media (max-width: 700px) {
    #side { width: auto; right: 66px; top: 58px; max-height: 62%; } /* เว้นคอลัมน์ปุ่มขวา (ซูม/ชั้นข้อมูล) */
    #side.hidden { display: none; }
    #toggle { display: block; }
    h1 { font-size: 21px; }
    #card { left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 60%; z-index: 5; }
    #bldLeg { left: 8px; right: 8px; bottom: 36px; width: auto; }
    #bldLeg .bl-lab { font-size: 10.5px; }
    .num { font-size: 38px; }
  }
  /* สถานที่และเหตุการณ์สำคัญ */
  .pl-row { margin-top: 14px; padding-top: 8px; border-top: 1px solid var(--rule); }
  .pl-sw { width: 12px; height: 12px; border-radius: 50%; flex: none; border: 2px solid var(--paper); box-shadow: 0 0 0 1px var(--muted); }
  .fac-leg { display: flex; flex-wrap: wrap; gap: 3px 10px; font-size: 12.5px; color: var(--muted); margin: 2px 0 8px; }
  .fac-leg span { display: inline-flex; align-items: center; gap: 5px; }
  .fac-leg i { width: 9px; height: 9px; border-radius: 50%; }
  #evList { list-style: none; padding: 0; margin: 2px 0 0; }
  #evList button, #evList .ev-nl { display: grid; grid-template-columns: 5.4em 1fr; gap: 8px; width: 100%; text-align: left; border: 0; background: none;
    padding: 5px 4px; font-size: 13.5px; line-height: 1.4; border-radius: 4px; }
  #evList button { cursor: pointer; }
  #evList button:hover, #evList button:focus-visible { background: var(--wash); }
  #evList .ev-y { font: 600 12.5px/1.45 var(--head); color: var(--staff); font-variant-numeric: tabular-nums; }
  #evList small { display: block; color: var(--muted); font-size: 12.5px; }
  /* กลุ่มเหตุการณ์และเรื่องแจ้ง Traffy */
  .grp-list { list-style: none; padding: 0; margin: 4px 0 0; }
  .grp-list button { display: grid; grid-template-columns: 6.6em 1fr; gap: 8px; width: 100%; text-align: left; border: 0; background: none;
    padding: 5px 4px; font-size: 13.5px; line-height: 1.4; border-radius: 4px; cursor: pointer; }
  .grp-list button:hover, .grp-list button:focus-visible { background: var(--wash); }
  .grp-list .ev-y { font: 600 12.5px/1.45 var(--head); color: var(--muted); font-variant-numeric: tabular-nums; }
  .grp-list small { display: block; color: var(--muted); font-size: 12.5px; }
  .pl-meta { font-size: 13px; color: var(--muted); margin: 4px 0 0; }
  .pl-meta b { color: var(--ink); font-weight: 600; }
  .pl-card a { color: var(--ink); text-decoration-color: var(--staff); text-underline-offset: 3px; }
  .tr-leg { margin: 2px 0 8px; font-size: 13px; }
  .tr-leg b { display: block; font-weight: 600; margin-bottom: 2px; }
  .tr-leg label.chk { margin: 4px 0; font-size: 13px; }
  .tr-leg small { color: var(--muted); }
  .tr-note { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
  .pl-card { margin: 0 0 12px; padding-bottom: 10px; border-bottom: 1px solid var(--rule); }
  .pl-card .pl-k { font-size: 12.5px; color: var(--muted); margin: 0 0 2px; display: flex; align-items: center; gap: 6px; }
  .pl-card h3 { font: 600 18px/1.3 var(--head); margin: 0 0 4px; padding-right: 22px; }
  .pl-card p { font-size: 14px; margin: 0 0 6px; }
  #slrCtl [data-yr] small { display: block; font-size: 11px; opacity: .8; }
  /* ตัวเลือกแผนที่ฐาน */
  .bm-ctl { position: relative; }
  .bm-ctl > button.bm-btn svg { width: 18px; height: 18px; display: block; margin: auto; color: #333; }
  .bm-pop { position: absolute; right: 38px; top: 0; width: 214px; background: var(--paper); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow); padding: 8px; font-family: var(--body); display: none; }
  .bm-ctl.open .bm-pop { display: block; max-height: calc(100vh - 90px); overflow-y: auto; }
  .bm-pop h3 { font: 600 13px var(--head); margin: 2px 4px 6px; letter-spacing: .02em; }
  .bm-pop button.bm-opt { display: flex; align-items: center; gap: 9px; width: 100%; height: auto;
    padding: 5px 6px; border: 0; background: none; color: inherit; font: 14px var(--body); text-align: left; cursor: pointer; border-radius: 6px; }
  .bm-pop button.bm-opt:hover { background: var(--wash); }
  .bm-pop button.bm-opt[aria-pressed="true"] { background: var(--wash); font-weight: 600; }
  .bm-opt img { width: 42px; height: 42px; border-radius: 5px; object-fit: cover; border: 1px solid var(--rule); flex: none; background: var(--wash); }
  .bm-note { font-size: 12px; line-height: 1.45; color: var(--muted); margin: 6px 4px 2px; }
  .bm-opt[aria-pressed="true"] img { outline: 2px solid var(--staff); outline-offset: 1px; }

  /* ---- ปุ่มด้านขวาทั้งหมดกว้าง 44 px; แถบชั้นข้อมูลมีชื่อสั้นใต้ไอคอน ชื่อเต็มอยู่ใน title ---- */
  .maplibregl-ctrl-top-right .maplibregl-ctrl-group button { width: 44px; height: 40px; }
  .maplibregl-ctrl-top-right .maplibregl-ctrl-group button .maplibregl-ctrl-icon { background-size: 34px; }
  .lr { width: 44px; background: #fff; color: #333; border-radius: 4px; box-shadow: 0 0 0 2px rgba(0, 0, 0, .1); font-family: var(--body); }
  .lr .lr-head, .lr .rl { position: relative; display: grid; justify-items: center; align-content: center; gap: 1px; width: 44px; min-height: 42px;
    padding: 4px 1px 3px; margin: 0; border: 0; background: none; color: #333; cursor: pointer; font: inherit; }
  .lr .lr-head { border-radius: 4px; }
  .lr .lr-head svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
  .lr .lr-head[aria-expanded="true"] { border-bottom: 1px solid #ddd; border-radius: 4px 4px 0 0; }
  .lr .rl:hover, .lr .lr-head:hover { background: rgba(0, 0, 0, .05); }
  .lr-list { max-height: calc(100dvh - 300px); overflow-y: auto; scrollbar-width: none; }
  .lr-foot { border-top: 1px solid #ddd; }
  .lr .rl input { position: absolute; top: 8px; left: 50%; width: 1px; height: 1px; margin: 0; opacity: 0; pointer-events: none; }
  .lr .ri { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; color: #56666b; transition: background .15s, color .15s; }
  .lr .ri svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .lr .rl input:checked + .ri, .bm-ctl.open .ri { background: var(--c); color: #fff; }
  .lr .rl input:focus-visible + .ri { outline: 2px solid var(--staff); outline-offset: 1px; }
  .lr .rt { font: 500 9.5px/1.15 var(--body); color: #56666b; text-align: center; max-width: 42px; overflow-wrap: anywhere; }
  .lr .lr-head .rt { font-weight: 600; color: #333; }
  .lr .rl input:checked ~ .rt { color: #1b2629; font-weight: 600; }
  .lr .bm-pop { right: calc(100% + 10px); top: auto; bottom: -2px; }
  @media (max-width: 700px) { .lr-list { max-height: calc(100dvh - 380px); } }
  .lr-hint { font-size: 12.5px; color: var(--muted); margin: 10px 0 0; }
  .credits { font-size: 11px; line-height: 1.45; color: var(--muted); margin: 10px 0 0; padding-top: 8px; border-top: 1px solid var(--rule); }
  .credits a { color: inherit; text-underline-offset: 2px; }
  .fac-leg b { flex-basis: 100%; font-weight: 600; color: var(--ink); }
</style>

<body>
<div id="map" role="application" aria-label="map"></div>
<section id="bldLeg" class="panel" aria-labelledby="bldLegT"></section>
<nav id="lyrRail" class="lr maplibregl-ctrl" aria-label="layers">
  <button id="lrHead" class="lr-head" type="button" aria-expanded="true" aria-controls="lrBody"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 8.5 12 14l10-5.5L12 3Z"/><path d="m2 13 10 5.5L22 13"/><path d="m2 17.5 10 5.5 10-5.5" opacity=".55"/></svg><span class="rt" data-i18n="rail">ชั้นข้อมูล</span></button>

    <li>ปุ่ม "อาคาร 2 มิติ" แสดงอาคารแบบแบนเมื่อซูมออก ปุ่ม "อาคาร 3 มิติ" แสดงอาคารตามความสูงจริงเมื่อซูมเข้าใกล้ (ระดับซูม 13 ขึ้นไป) ถ้าปิด 3 มิติ อาคารจะแบนทุกระดับซูม</li></ul>
    <h4>การเติมช่องว่าง</h4>
    <p>ช่องที่ดาวเทียมวัดไม่ได้ส่วนใหญ่เป็นบ่อเลี้ยงสัตว์น้ำ นาข้าว และแหล่งน้ำ ซึ่งไม่เหมือนเมืองหรือถนนข้าง ๆ การเฉลี่ยจากจุดวัดรอบ ๆ อย่างเดียว (IDW) จึงยืมค่าจากพื้นที่ที่ทรุดคนละแบบ เราจึงเติมสองชั้น (regression kriging แบบง่าย): (1) แบบจำลอง gradient boosting เรียนอัตราทรุดของช่องที่วัดได้ 336,732 ช่องจากสัดส่วนสิ่งปกคลุมดิน ESA WorldCover 2021 (10 ม.) ในช่องและรอบ ๆ (ราว 0.5 และ 2 กม.) จำนวนอาคาร ประชากร WorldPop 2025 ความสูง DeltaDTM ระยะถึงทะเลและแหล่งน้ำ และตำแหน่ง (แนวโน้มระดับภูมิภาคจากการสูบน้ำบาดาล) (2) ส่วนต่างระหว่างค่าวัดกับแบบจำลองของจุดวัดใกล้ ๆ บวกกลับโดยลดลงตามระยะ (ครึ่งหนึ่งที่ราว 1 กม.) ใกล้จุดวัดค่าจึงต่อกับค่าวัด ไกลออกไปขึ้นกับสิ่งปกคลุมดินเป็นหลัก ทดสอบโดยซ่อนจุดวัดทั้งบล็อก 3 × 3 กม. แล้วประมาณกลับ: คลาดเฉลี่ย 1.7 มม. ต่อปี (IDW 2.0) และในช่องที่เป็นบ่อหรือนาเป็นส่วนใหญ่ 2.9 มม. ต่อปี (IDW 3.3) IDW ประเมินการทรุดในบ่อและนาต่ำไปเฉลี่ย 0.65 มม. ต่อปี วิธีใหม่ไม่เอียง ช่องที่เติมคิดเป็น 29% ของพื้นที่ศึกษา ครึ่งหนึ่งห่างจุดวัดไม่เกิน 220 ม. และ 95% ไม่เกิน 1.6 กม. ค่าเติมไม่ได้ใช้ในตารางสรุปรายเขต การจัดอันดับ และ exposure</p>
    <h4>แผนที่ความเสี่ยง</h4>
    <p>ความเสี่ยง = <b>ภัย × การสัมผัสภัย × ความเปราะบาง</b> (กรอบของ UNDRR) คำนวณทุกช่องขนาด 100 × 100 ม. แต่ละส่วนปรับเป็น 0–1 เทียบกันทั้งพื้นที่ศึกษา แล้วแบ่งช่องที่มีคนหรืออาคารเป็น 5 ระดับเท่า ๆ กัน (ระดับละ 20%) จึงเป็น<b>ความเสี่ยงเปรียบเทียบ</b> ไม่ใช่ความน่าจะเป็นของความเสียหาย ช่องที่ดาวเทียมวัดไม่ได้ใช้อัตราทรุดจากค่าเติม และช่องที่ไม่มีคนหรืออาคารก็จัดระดับด้วยเกณฑ์เดียวกัน (มักต่ำมาก) แผนที่จึงเต็มพื้นที่ศึกษา ช่องเดิมได้ระดับเท่าเดิมทุกช่อง การ์ดบอกว่าช่องไหนใช้ค่าเติม</p>
    <ul><li><b>ภัย</b>: อัตราทรุด, การทรุดไม่เท่ากันที่อาจกระทบอาคาร (angular distortion), น้ำท่วม 21 ต.ค. 2569 บริเวณใกล้เคียง</li>
    <li><b>คนและอาคาร</b>: จำนวนคนและพื้นที่อาคารในช่อง, จำนวนโรงเรียน โรงพยาบาล สถานีดับเพลิง สถานีตำรวจ และสถานีรถไฟในรัศมี 500 ม.</li>
    <li><b>ความเปราะบาง</b> (ในรัศมี 500 ม.): สัดส่วนผู้สูงอายุ 65 ปีขึ้นไป, เด็กอายุต่ำกว่า 5 ปี (WorldPop 2025), อาคารเตี้ยไม่เกิน 6 ม. (บ้านแนวราบมักใช้เสาเข็มสั้น) และระยะทางถึงโรงพยาบาลที่ใกล้ที่สุด</li></ul>
    <h4>น้ำท่วมจากทะเล: ปัจจุบัน</h4>
    <p>ใช้ภาพเรดาร์ Sentinel-1 ที่ถ่ายตรงกับช่วงน้ำขึ้นสูง (เลือกจากระดับน้ำที่ปากแม่น้ำเจ้าพระยาตอนดาวเทียมผ่าน ช่วงหน้าแล้งเพื่อไม่ให้น้ำฝนปน) เทียบกับภาพตอนน้ำลงของวงโคจรเดียวกัน พื้นที่ที่เป็นน้ำตอนน้ำขึ้นแต่แห้งตอนน้ำลงคือที่ที่น้ำทะเลขึ้นถึงจริง บ่อและแหล่งน้ำที่มีน้ำอยู่ตลอดไม่นับ เรดาร์มองน้ำใต้ป่าชายเลนและระหว่างตึกได้ไม่ดี และบอกความลึกไม่ได้</p>
    <h4>น้ำท่วมจากทะเลในอนาคต</h4>
    <p>จำลองด้วยแบบจำลองชลศาสตร์ 2 มิติ SFINCS (Deltares) บนกริด 100 ม. ปล่อยน้ำทะเลเข้าจากอ่าวไทยตามระดับน้ำจริงทุก 10 นาที (น้ำขึ้นลง + คลื่นพายุ จาก GTSM ของ Copernicus) ช่วงน้ำขึ้นสูงสุดของปี 2567 (24 มิ.ย., +2.0 ม. ที่ปากแม่น้ำ) แล้วบวกระดับน้ำทะเลที่สูงขึ้นตาม IPCC AR6 (ค่ากลาง ฉบับที่ไม่รวมการเคลื่อนตัวของแผ่นดิน) ภูมิประเทศมาจาก DeltaDTM ปรับเป็นความสูงเหนือระดับน้ำทะเล (+1.08 ม. จาก EGM2008) แล้วลบการทรุดสะสมตามอัตราจาก InSAR (ช่องที่วัดไม่ได้ใช้ค่าเติมเดียวกับแผนที่อัตราทรุด) น้ำต้องไหลผ่านพื้นที่ที่ต่อเนื่องกันจริง และถูกกั้นด้วยพื้นที่สูงหรือคันกั้นน้ำ</p>
    <p>ปุ่มปีคือปัจจุบัน (2569) และ 10 กับ 20 ปีข้างหน้า (2579, 2589) ระดับน้ำทะเลตาม AR6 สูงกว่าปี 2567 อยู่ 5.5 และ 11.1 ซม. (SSP2-4.5) หรือ 6.7 และ 13.5 ซม. (SSP5-8.5) สองฉากทัศน์จึงต่างกันเพียง 1–2 ซม. ในช่วงนี้ ความต่างหลักมาจากการทรุดซึ่งเท่ากับ 10–20 ปีของอัตราในแผนที่</p>
    <p>กรณี "มีคัน" ใส่กำแพงริมแม่น้ำเจ้าพระยาสูง +2.8 ม. (ค่าออกแบบของ กทม.) และแนวถนนสุขุมวิทชายฝั่งสมุทรปราการ +2.5 ม. (สมมติ) ซึ่งทรุดลงตามพื้นดินในกรณี "ทรุดต่อ" ไม่มีข้อมูลแนวคันพระราชดำริและคันริมแม่น้ำท่าจีน จึงไม่ได้ใส่ แบบจำลองไม่รวมฝน น้ำเหนือ และเครื่องสูบน้ำ ผลจึงใช้เปรียบเทียบระหว่างฉากทัศน์ ไม่ใช่การพยากรณ์น้ำท่วมรายจุด</p>
    <p>แผนที่แสดงเฉพาะน้ำท่วมที่ต่อเนื่องจากทะเลผ่านพื้นที่ที่ท่วมด้วยกัน แอ่งที่ท่วมแยกอยู่ในแผ่นดิน หรือเชื่อมกับทะเลผ่านร่องแม่น้ำและคลองเท่านั้น (เช่น หนองจอก ลาดกระบัง ดอนเมือง) ตัดออก เพราะเกิดจากความคลาดของ DEM หรือน้ำที่ล้นตามลำน้ำ ไม่ใช่แนวน้ำทะเลที่ขึ้นมาจริง (ตัดออก 7–10 ตร.กม. ในกรณีมีคัน และ 46–54 ตร.กม. ในกรณีไม่มีคัน) บ่อ คลอง และแม่น้ำที่อยู่ภายในแนวน้ำท่วมระบายสีตามความลึกของช่องข้างเคียง (ไม่เกิน 500 ม.) แนวจึงไม่เป็นรู</p>
    <p>ตรวจความต่อเนื่องของน้ำท่วมชายฝั่ง: ช่องแผ่นดินที่ติดทะเลทั้งแนว (ราว 80 กม. จากสมุทรสาครถึงสมุทรปราการ) ถูกน้ำท่วมครบ 100% ในทั้ง 18 ฉากทัศน์ และน้ำท่วมเป็นแนวเดียวกันสองฝั่งของร่องแม่น้ำเจ้าพระยา (ชิ้นเล็กที่เหลือรวม 0.04 ตร.กม.)</p>
    <h4>สถานที่และเหตุการณ์สำคัญ</h4>
    <p>จุดสีดำคือสถานที่สำคัญ (ตำแหน่งจาก OpenStreetMap) จุดสีตามประเภทคือโรงเรียน มหาวิทยาลัย โรงพยาบาล สถานีตำรวจ สถานีดับเพลิง สถานีรถไฟ และสนามบิน 1,538 แห่งที่ใช้ประเมิน exposure ค่าที่การ์ดคืออัตราทรุดเฉลี่ยรอบสถานที่ (จุด: ถ่วงน้ำหนักในรัศมี 500 ม.; พื้นที่: ภายในขอบเขต) พร้อมช่วงตามความไม่แน่นอนและระดับการทรุดไม่เท่ากัน (β) จุดสีตามกลุ่มคือ 37 เหตุการณ์ดินทรุด หลุมยุบ และความเสียหายจากแผ่นดินไหวที่รวบรวมจากข่าว (2564–2569) ตำแหน่งเป็นค่าประมาณจากที่อยู่ในข่าว ชั้น "เรื่องแจ้ง" คือจุดที่ประชาชนแจ้งใน Traffy Fondue (public API) ซึ่งเกือบทั้งหมดอยู่ในกรุงเทพฯ หนึ่งจุดอาจรวมหลายเรื่องที่แจ้งซ้ำ ไม่แสดงข้อความและรูปที่ผู้แจ้งส่งมา หลุมยุบส่วนใหญ่เกิดจากงานใต้ดินหรือท่อรั่ว จึงไม่ได้สะท้อนอัตราทรุดที่ดาวเทียมวัดโดยตรง</p>
    <h4>น้ำท่วม</h4>
    <p>พื้นที่น้ำท่วมมาจากภาพเรดาร์ Sentinel-1 วันที่ 21 ต.ค. 2569 (สองวันหลัง 19 ต.ค.) เทียบกับภาพหน้าแล้ง ก.พ.–มี.ค. 2569 ของวงโคจรเดียวกัน พื้นที่ที่ภาพมืดลงชัดเจนเพราะมีน้ำนิ่งปกคลุมถูกจัดเป็นน้ำท่วม แหล่งน้ำถาวรไม่แสดง <b>เรดาร์มองน้ำท่วมในเขตเมืองที่มีตึกหนาแน่นได้ไม่ดี</b> จึงอาจขาดน้ำท่วมตามถนนและชุมชน ส่วนนาข้าวหรือบ่อที่ปล่อยน้ำเข้าตามฤดูกาลอาจถูกนับรวมด้วย</p>
    <p>ชั้น Copernicus GFM (สีชมพู) เป็นแผนที่น้ำท่วมอัตโนมัติของ Copernicus Emergency Management Service จากภาพวันเดียวกันแต่คนละวิธี GFM จับได้ 45 ตร.กม. ในสามจังหวัด แผนที่ของเราจับได้ 100 ตร.กม. พื้นที่ 84% ของ GFM อยู่ในแผนที่ของเรา และเขตที่ท่วมมากที่สุดเรียงลำดับเหมือนกัน</p>
    <h4>ข้อจำกัด</h4>
    <ul><li>ค่าทั้งหมดผูกกับสถานี GNSS ที่จุฬาลงกรณ์มหาวิทยาลัย ซึ่งเองก็ทรุดราว 4 มม. ต่อปี ความคลาดเคลื่อนของสถานีนี้มีผลกับทั้งแผนที่</li>
    <li>กราฟรายเดือนมีสัญญาณตามฤดูกาลและสัญญาณรบกวนจากชั้นบรรยากาศ ให้ดูแนวโน้มมากกว่าค่าแต่ละเดือน</li>
    <li>ไม่พบหลักฐานชัดเจนว่าแผ่นดินไหว 28 มี.ค. 2568 ทำให้อัตราการทรุดเปลี่ยนไป</li>
    <li>การเทียบกับขั้นบันไดใช้ความสูงขั้นละ 15 ซม. และสมมติว่าอัตราการทรุดคงที่</li>
    <li><b>ทางตะวันออกอาจแดงเกินจริง</b>: เทียบกับ GNSS ที่ สจล. ลาดกระบัง (KMIT) ช่วง 2567–2569 InSAR ให้ทรุดมากกว่า GNSS ราว 3–6 มม. ต่อปี และสองวงโคจรให้ค่าต่างกันเป็นแนวลาดจากตะวันตกไปตะวันออก (ดูไฟล์วิธีทำด้านล่าง) ค่า ± ในการ์ดรวมความต่างนี้แล้ว จุดที่ไม่แน่นอนเกิน 5 มม. ต่อปีแสดงเป็นสีจาง</li></ul>
    <h4>ดาวน์โหลดข้อมูล (GeoTIFF, UTM 47N)</h4>

  en: `<h3>How it was measured</h3>
    <p>This map shows how fast the ground surface sinks on average each year, measured from Sentinel-1 satellite radar on ascending and descending orbits (157 acquisitions each) between April 2021 and October 2026, using SBAS InSAR at about 80 m resolution.</p>
    <h4>How to read it</h4>
    <ul><li>The ± is an approximate uncertainty: the statistical error combined with half the difference between the two satellite orbits.</li>
    <li>Values are millimetres per year. 15 mm a year means about 15 cm lower after 10 years if the rate continues.</li>
    <li>Colours show how fast the ground sinks, not whether buildings will be damaged. Damage depends on foundations and on uneven sinking over short distances.</li>
    <li>Spots the satellite cannot measure reliably, such as rice fields, fish ponds and water (about 29% of the study area), are filled with estimates from land cover and nearby measurements so the three provinces are fully covered. Untick the box under the colour bar to hide them; the card says when a value is an estimate.</li>
    <li>Building colours follow the selected tab: the sinking rate of the surrounding 80 m cell, the sea flooding depth of the selected scenario (100 m cell) or the risk class (100 m cell), not a measurement of each building.</li>
    <li>"Bldg 2D" shows flat footprints when zoomed out; "Bldg 3D" shows buildings at their real height when zoomed in (zoom 13 and closer). With 3D off, buildings stay flat at every zoom.</li></ul>
    <h4>Filling the gaps</h4>
    <p>Most cells the satellite cannot measure are fish ponds, rice fields and water, which behave differently from the towns and roads next to them, so averaging nearby measurements alone (IDW) borrows values from land that sinks differently. The gaps are filled in two layers (a simple regression kriging): (1) a gradient-boosting model learns the sinking rate of the 336,732 measured cells from ESA WorldCover 2021 (10 m) land-cover shares in and around the cell (about 0.5 and 2 km), building count, WorldPop 2025 population, DeltaDTM height, distance to the sea and to water, and position (the regional pattern of groundwater pumping); (2) the difference between measurement and model at nearby measured cells is added back, fading with distance (half at about 1 km), so values join the measurements near them and depend mainly on land cover further away. Hiding whole 3 × 3 km blocks of measurements and estimating them back gives a mean error of 1.7 mm a year (IDW 2.0), and 2.9 mm a year in cells that are mostly ponds or fields (IDW 3.3). IDW underestimates sinking in ponds and fields by 0.65 mm a year on average; the new method shows no bias. Filled cells make up 29% of the study area; half are within 220 m of a measurement and 95% within 1.6 km. Estimates are not used in the district tables, rankings or exposure figures.</p>
    <h4>Risk map</h4>
    <p>Risk = <b>hazard × exposure × vulnerability</b> (UNDRR framework), computed for every 100 × 100 m cell. Each part is scaled 0–1 across the study area and cells with people or buildings are split into 5 equal classes (20% each), so it shows <b>relative risk</b>, not a probability of damage. Cells the satellite cannot measure use the filled sinking rate, and cells without people or buildings are classed with the same edges (usually very low), so the map covers the whole study area; previously classed cells keep their class. The card says when a cell uses the estimate.</p>
    <ul><li><b>Hazard</b>: sinking rate, uneven sinking that can affect buildings (angular distortion), flooding nearby on 21 Oct 2026</li>
    <li><b>People and buildings</b>: people and building area in the cell, and schools, hospitals, fire and police stations and rail stations within 500 m</li>
    <li><b>Vulnerability</b> (within 500 m): share aged 65+, share under 5 (WorldPop 2025), low buildings up to 6 m (houses often on short piles), and distance to the nearest hospital</li></ul>
    <h4>Flooding from the sea: today</h4>
    <p>Uses Sentinel-1 radar images taken at high tide (chosen from the water level at the Chao Phraya mouth at overpass time, in the dry season so rain does not mix in), compared with a low-tide image from the same orbit. Land that is wet at high tide but dry at low tide is where the sea actually reached. Ponds and water bodies that are always wet are not counted. Radar sees water under mangroves and between buildings poorly and cannot measure depth.</p>
    <h4>Future flooding from the sea</h4>
    <p>Simulated with the 2D hydrodynamic model SFINCS (Deltares) on a 100 m grid. Sea water enters from the Gulf of Thailand following real 10-minute water levels (tide + storm surge, Copernicus GTSM) during the highest tide of 2024 (24 June, +2.0 m at the river mouth), plus IPCC AR6 sea-level rise (median, version without land motion). Ground height comes from DeltaDTM converted to height above sea level (+1.08 m from EGM2008), minus accumulated sinking at the InSAR rate (unmeasured cells use the same filled rate as the sinking map). Water must flow through connected low ground and is stopped by higher land or dikes.</p>
    <p>The year buttons are today (2026) and 10 and 20 years ahead (2036, 2046). AR6 sea level is 5.5 and 11.1 cm above 2024 (SSP2-4.5) or 6.7 and 13.5 cm (SSP5-8.5), so the two scenarios differ by only 1–2 cm over this period; the main difference comes from sinking, which is 10–20 years of the mapped rate.</p>
    <p>"With dikes" adds Chao Phraya flood walls at +2.8 m (BMA design value) and the Sukhumvit coastal road in Samut Prakan at +2.5 m (assumed); they sink with the ground when sinking continues. The King's Dike and Tha Chin river walls are not included for lack of data. Rain, river floods and pumping are not modelled, so the results compare scenarios rather than forecast flooding at a given spot.</p>
    <p>The map shows only flooding that connects to the sea through other flooded land. Patches that flood on their own inland, or reach the sea only along a river or canal channel (for example Nong Chok, Lat Krabang, Don Mueang), are removed because they come from DEM errors or water spilling along channels rather than the sea rising over land (7–10 km² removed with dikes, 46–54 km² without). Ponds, canals and rivers inside the flooded band take the depth of the nearest flooded cell (within 500 m), so the band has no holes.</p>
    <p>Coastal continuity check: 100% of the land cells touching the sea along the whole coast (about 80 km from Samut Sakhon to Samut Prakan) flood in all 18 scenarios, and the flooding forms one band on each side of the Chao Phraya channel (remaining specks total 0.04 km²).</p>
    <h4>Key places and events</h4>
    <p>Black dots are key places (positions from OpenStreetMap). Dots coloured by type are the 1,538 schools, universities, hospitals, police and fire stations, rail stations and airports used in the exposure analysis; the card gives the average sinking around the site (points: weighted within 500 m; areas: within the outline), its range with uncertainty and the uneven-sinking class (β). Dots coloured by group are 37 ground collapses, sinkholes and earthquake damage reports compiled from the news (2021–2026), placed approximately from the addresses given. The "Reports" layer shows points residents reported on Traffy Fondue (public API), almost all in Bangkok; one point may merge repeated reports, and the text and photos are not shown. Most sinkholes come from underground works or leaking pipes, so they do not directly reflect the sinking rate the satellites measure.</p>
    <h4>Flooding</h4>
    <p>Flooded areas come from Sentinel-1 radar on 21 Oct 2026 (two days after 19 Oct), compared with dry-season images from Feb–Mar 2026 on the same orbit. Land that turned clearly darker because still water covered it is mapped as flooded; permanent water is not shown. <b>Radar sees flooding in dense built-up areas poorly</b>, so street and neighbourhood flooding may be missing, while seasonally filled rice fields or ponds may be included.</p>
    <p>The Copernicus GFM layer (pink) is the automatic flood map of the Copernicus Emergency Management Service from the same image with a different method. GFM maps 45 km² in the three provinces, our map 100 km²; 84% of the GFM area lies inside ours and the most-flooded districts rank the same.</p>
    <h4>Limitations</h4>
    <ul><li>All values are tied to the GNSS station at Chulalongkorn University, which itself sinks about 4 mm a year; any error there shifts the whole map.</li>
    <li>Monthly chart values include seasonal and atmospheric noise; read the trend rather than single months.</li>
    <li>We found no clear evidence that the 28 March 2025 earthquake changed subsidence rates.</li>
    <li>The stair-step comparison uses a 15 cm step and assumes the rate stays the same.</li>
    <li><b>The east may look redder than it is</b>: compared with the GNSS station at KMITL Lat Krabang (KMIT) for 2024–2026, InSAR shows 3–6 mm a year more sinking, and the two orbits disagree along a west-to-east slope (see the method file below). The ± in the card includes this disagreement; spots more uncertain than 5 mm a year are drawn faded.</li></ul>

  const step = `<line x1="-4" x2="38" y1="${STEP_CM * px}" y2="${STEP_CM * px}" stroke="var(--muted)" stroke-dasharray="3 3"/>`;

function drawChart(d) {

      paint: { 'raster-opacity': ['interpolate', ['linear'], ['zoom'], 12, 0.88, 14.5, 0.4], 'raster-resampling': 'nearest' } }, firstSymbol);
    riskGrid = { ...meta.risk.grid, data: new Uint8Array(await fetch('risk.bin').then(r => r.arrayBuffer())) };
    try { riskxGrid = new Uint8Array(await fetch('riskx.bin').then(r => r.arrayBuffer())); } catch (err) { riskxGrid = null; }
    $('m-risk').hidden = false;
  }
  if (meta.tide) {
    map.addSource('ss-tide', { type: 'image', url: 'tide.png', coordinates: meta.tide.image });
    map.addLayer({ id: 'ss-tide', type: 'raster', source: 'ss-tide', layout: { visibility: 'none' }, paint: { 'raster-resampling': 'nearest', 'raster-opacity': .9 } }, firstSymbol);
  }
  if (meta.sfl) {
    map.addSource('ss-slr', { type: 'image', url: `fl_${runName() .replace(/^now_/, '2036_ssp245_sub_')}.png`, coordinates: meta.sfl.image });
    map.addLayer({ id: 'ss-slr', type: 'raster', source: 'ss-slr', layout: { visibility: 'none' }, paint: { 'raster-resampling': 'nearest', 'raster-opacity': .9 } }, firstSymbol);
    $('m-slr').hidden = false;
  }
  if (meta.flood) {
    map.addSource('ss-flood', { type: 'image', url: 'flood.png', coordinates: meta.flood.image });
    map.addLayer({ id: 'ss-flood', type: 'raster', source: 'ss-flood', layout: { visibility: 'none' }, paint: { 'raster-opacity': .9, 'raster-resampling': 'nearest' } }, firstSymbol);
    $('floodRow').hidden = false;
  }
  if (meta.gfm) {
    map.addSource('ss-gfm', { type: 'image', url: 'gfm.png', coordinates: meta.gfm.image });
    map.addLayer({ id: 'ss-gfm', type: 'raster', source: 'ss-gfm', layout: { visibility: 'none' }, paint: { 'raster-opacity': .9, 'raster-resampling': 'nearest' } }, firstSymbol);
    $('gfmRow').hidden = false;
  }
  map.addSource('ss-dist', { type: 'geojson', data: districtsGeo });
  map.addLayer({ id: 'ss-dist', type: 'line', source: 'ss-dist',
    paint: { 'line-color': '#1b2629', 'line-opacity': .45, 'line-width': ['interpolate', ['linear'], ['zoom'], 9, .5, 14, 1.3] } }, firstSymbol);
  meta.buildings.forEach((f, i) => {
    map.addSource(`ss-b${i}`, { type: 'vector', url: `pmtiles://${new URL(f, location.href)}` });
    map.addLayer({ id: `ss-bld${i}`, type: 'fill-extrusion', source: `ss-b${i}`, 'source-layer': 'buildings', minzoom: 13,
      paint: { 'fill-extrusion-color': colorExpr('c'), 'fill-extrusion-height': ['get', 'h'], 'fill-extrusion-opacity': .93 } });
    map.addLayer({ id: `ss-bldf${i}`, type: 'fill', source: `ss-b${i}`, 'source-layer': 'buildings', minzoom: 13, layout: { visibility: 'none' },
      paint: { 'fill-color': colorExpr('c'), 'fill-outline-color': 'rgba(60,20,20,0.35)', 'fill-opacity': .95 } }, firstSymbol);
  });
  if (meta.bldLo) {
    // ซูมออก (z10–13): อาคารแบบ 2 มิติ ไม่มีความสูง จาก buildings_lo.pmtiles (scripts/bld_export.py + tippecanoe)
    map.addSource('ss-blo', { type: 'vector', url: `pmtiles://${new URL(meta.bldLo, location.href)}` });
    map.addLayer({ id: 'ss-blo', type: 'fill', source: 'ss-blo', 'source-layer': 'buildings', minzoom: 10, maxzoom: 13,
      paint: { 'fill-color': colorExpr('c'), 'fill-outline-color': 'rgba(60,20,20,0.35)', 'fill-opacity': ['interpolate', ['linear'], ['zoom'], 10, .75, 12.5, .95] } }, firstSymbol);
  }
  // ป้าย 6 เขตที่ทรุดเร็วที่สุด เขียนลงบนแผนที่ตรง ๆ
  map.addLayer({ id: 'ss-lab', type: 'symbol', source: 'ss-dist', maxzoom: 12.5, filter: ['<=', ['get', 'rank'], 6],
    layout: { 'text-field': labelExpr(), 'text-font': font, 'text-size': 13, 'text-line-height': 1.25, 'text-padding': 4 },
    paint: { 'text-color': '#1b2629', 'text-halo-color': '#ffffff', 'text-halo-width': 1.6 } });
  // สถานที่สำคัญ, สถานที่ที่ประเมิน exposure (results/exposure_full/facilities.gpkg) และเหตุการณ์สำคัญ
  const halo = { 'text-halo-color': '#ffffff', 'text-halo-width': 1.6 };
  try {
    map.addSource('pl-fac', { type: 'geojson', data: await fetch('facilities.geojson').then(r => r.json()) });
    map.addLayer({ id: 'pl-fac', type: 'circle', source: 'pl-fac', minzoom: 10, layout: { visibility: 'none' },
      paint: { 'circle-color': ['match', ['get', 't'], ...Object.entries(FAC_COLORS).flat(), '#666666'],
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 10, 2.5, 15, 6.5], 'circle-stroke-color': '#ffffff', 'circle-stroke-width': 1 } });
    map.addLayer({ id: 'pl-fac-lab', type: 'symbol', source: 'pl-fac', minzoom: 14.5, layout: { visibility: 'none', 'text-field': ['get', 'n'], 'text-font': font,
      'text-size': 11.5, 'text-offset': [0, 0.9], 'text-anchor': 'top', 'text-optional': true }, paint: { 'text-color': '#3c4a4e', ...halo } });
  } catch (err) { /* ไม่มีไฟล์ก็ข้ามไป */ }
  map.addSource('pl-lm', { type: 'geojson', data: lmGeo() });
  map.addLayer({ id: 'pl-lm', type: 'circle', source: 'pl-lm',
    paint: { 'circle-color': '#1b2629', 'circle-radius': ['interpolate', ['linear'], ['zoom'], 9, 3.5, 15, 6.5], 'circle-stroke-color': '#ffffff', 'circle-stroke-width': 1.5 } });
  map.addLayer({ id: 'pl-lm-lab', type: 'symbol', source: 'pl-lm', minzoom: 10.5, layout: { 'text-field': ['get', 'name'], 'text-font': font, 'text-size': 12,
    'text-offset': [0, 0.8], 'text-anchor': 'top', 'text-optional': true }, paint: { 'text-color': '#1b2629', ...halo } });
  map.addSource('pl-ev', { type: 'geojson', data: evGeo() });
  map.addLayer({ id: 'pl-ev', type: 'circle', source: 'pl-ev',
    paint: { 'circle-color': '#c41e24', 'circle-radius': ['interpolate', ['linear'], ['zoom'], 9, 6, 15, 9], 'circle-stroke-color': '#ffffff', 'circle-stroke-width': 2 } });
  map.addLayer({ id: 'pl-ev-lab', type: 'symbol', source: 'pl-ev', layout: { 'text-field': ['get', 'label'], 'text-font': font, 'text-size': 12,
    'text-offset': [0, 1.1], 'text-anchor': 'top', 'text-optional': true, 'text-max-width': 9 }, paint: { 'text-color': '#a3181d', ...halo } });
  try {
    evPts = await fetch('events.geojson').then(r => r.json());
    map.addSource('pl-evn', { type: 'geojson', data: evPts });
    map.addLayer({ id: 'pl-evn', type: 'circle', source: 'pl-evn', paint: {
      'circle-color': ['match', ['get', 'g'], ...Object.entries(EV_COLORS).flat(), '#888888'],
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 9, ['case', ['in', ['get', 'acc'], ['literal', ['ย่าน', 'เขต']]], 7, 4.5], 15, ['case', ['in', ['get', 'acc'], ['literal', ['ย่าน', 'เขต']]], 12, 8]],
      'circle-stroke-color': '#ffffff', 'circle-stroke-width': 1.5 } }, 'pl-ev');
    applyEvFocus();
  } catch (err) { /* ไม่มีไฟล์ก็ข้ามไป */ }
  applyLang();

  map.on('click', e => {
    const plLayers = ['pl-ev', 'pl-evn', 'pl-lm', 'pl-fac', 'pl-tr'].filter(l => map.getLayer(l) && map.getLayoutProperty(l, 'visibility') !== 'none');
    const pf = map.queryRenderedFeatures([[e.point.x - 6, e.point.y - 6], [e.point.x + 6, e.point.y + 6]], { layers: plLayers })[0];
    if (pf) {
      const [x, y] = pf.geometry.coordinates;
      $('results').hidden = true;
      showCard({ v: gridValue(x, y), district: districtAt(x, y), lnglat: [x, y], place: { layer: pf.layer.id, ...pf.properties } });
      placeMarker(x, y);
      return;
    }
    const { lng, lat } = e.lngLat;
    const layers = meta.buildings.flatMap((_, i) => [`ss-bld${i}`, `ss-bldf${i}`]).filter(l => map.getLayer(l) && map.getLayoutProperty(l, 'visibility') !== 'none');
    const f = map.queryRenderedFeatures(e.point, { layers })[0];
    const district = districtAt(lng, lat), lnglat = [lng, lat];
    $('results').hidden = true;
    if (f && f.layer.id.startsWith('ss-bld')) {
      const p = f.properties;
      showCard({ v: p.v ?? null, h: p.h, district: p.d !== undefined && p.d !== null ? districtsGeo.features[p.d].properties : district, lnglat });
    } else {
      showCard({ v: gridValue(lng, lat), district, lnglat });
    }
    placeMarker(lng, lat);
  });
  map.on('mousemove', e => {
    const layers = [...meta.buildings.flatMap((_, i) => [`ss-bld${i}`, `ss-bldf${i}`]), ...['pl-ev', 'pl-evn', 'pl-lm', 'pl-fac', 'pl-tr']].filter(l => map.getLayer(l));
    map.getCanvas().style.cursor = map.queryRenderedFeatures(e.point, { layers }).length ? 'pointer' : '';
  });

  const vis = (ids, on) => ids.forEach(id => map.getLayer(id) && map.setLayoutProperty(id, 'visibility', on ? 'visible' : 'none'));
  $('m-sub').onclick = () => setMode('sub');
  $('m-risk').onclick = () => setMode('risk');
  $('m-slr').onclick = () => setMode('slr');
  const pick = (attr, set) => document.querySelectorAll(`[data-${attr}]`).forEach(b => b.onclick = () => {
    set(b.dataset[attr]); document.querySelectorAll(`[data-${attr}]`).forEach(x => x.setAttribute('aria-pressed', x === b)); showFlood(); });
  pick('yr', v => slrYear = +v); pick('ssp', v => ssp = v); pick('sub', v => subOn = v); pick('def', v => defOn = v);
  const bldVis = () => {
    // ปุ่ม 2 มิติ: อาคารแบนตอนซูมออก (และตอนซูมเข้าถ้าปิด 3 มิติ) ปุ่ม 3 มิติ: อาคารตามความสูงตั้งแต่ซูม 13
    const d2 = $('l-bld').checked, d3 = $('l-b3d').checked;
    vis(['ss-blo'], d2);
    vis(meta.buildings.map((_, i) => `ss-bld${i}`), d3);
    vis(meta.buildings.map((_, i) => `ss-bldf${i}`), d2 && !d3);
    $('bldLeg').hidden = !(d2 || d3);
    if (!d3 && map.getPitch() > 0) map.easeTo({ pitch: 0, duration: 600 });
  };
  $('l-bld').onchange = bldVis; $('l-b3d').onchange = bldVis;
  $('l-road').onchange = e => { roadsOn = e.target.checked; applyRoads(); };
  $('l-dist').onchange = e => vis(['ss-dist'], e.target.checked);
  $('l-lab').onchange = e => vis(['ss-lab'], e.target.checked);
  $('l-flood').onchange = e => vis(['ss-flood'], e.target.checked);
  $('l-gfm').onchange = e => vis(['ss-gfm'], e.target.checked);
  $('l-lm').onchange = e => vis(['pl-lm', 'pl-lm-lab'], e.target.checked);
  $('l-fac').onchange = e => { vis(['pl-fac', 'pl-fac-lab'], e.target.checked); $('facLeg').hidden = !e.target.checked; };
  $('l-ev').onchange = e => vis(['pl-ev', 'pl-ev-lab', 'pl-evn'], e.target.checked);
  $('l-tr').onchange = e => setTraffy(e.target.checked);
  $('legend').addEventListener('change', e => { if (e.target.id === 'l-idw') { idwOn = e.target.checked; applyIdw(); } });
});

map.on('zoomend', () => { if (map.getZoom() >= 13 && map.getPitch() < 20 && $('l-b3d').checked) map.easeTo({ pitch: 50, duration: 600 }); });
$('lang').onclick = () => { lang = lang === 'th' ? 'en' : 'th'; applyLang(); renderBm(); };
$('aboutBtn').onclick = () => $('about').classList.add('open');
$('about').onclick = e => { if (e.target.id === 'about') $('about').classList.remove('open'); };
$('cardClose').onclick = () => { $('card').classList.remove('open'); last = null; lastGrp = null; marker?.remove(); evFocus = null; applyEvFocus(); };
$('toggle').onclick = () => { $('side').classList.toggle('hidden'); if (small() && !$('side').classList.contains('hidden')) railOpen(false); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('about').classList.remove('open'); $('card').classList.remove('open'); $('results').hidden = true; } });
</script>
</body>
</html>
